<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascend Fleet</title>
<link rel="stylesheet" href="/shared/fleet.css">
<style>
/* Page-specific: the pitch layout. Everything reusable is in fleet.css, and
 * these now take their type, space and depth from the same tokens rather
 * than hard-coding a second, slightly different scale. */

.hero { padding: var(--s8) 0 var(--s6); margin-bottom: var(--s6); position: relative; }
/* A quiet wash behind the hero rather than a rule under it. A 1px line
 * across the top of a pitch page reads as a form; a gradient reads as a
 * surface the content sits on. */
.hero::before {
  content: ''; position: absolute; inset: calc(-1 * var(--s6)) -50vw 0;
  background: radial-gradient(70ch 40ch at 20% 0%, var(--brand-wash), transparent 70%);
  pointer-events: none; z-index: -1;
}
.hero .kicker {
  display: inline-flex; align-items: center; gap: var(--s2);
  font-size: var(--t-micro); font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--brand-ink);
  padding: 4px 10px; border: 1px solid var(--brand); border-radius: var(--radius-pill);
  background: var(--brand-wash); margin-bottom: var(--s4);
}
.hero h1 {
  margin: 0 0 var(--s4); font-size: clamp(2rem, 5vw, 3.25rem); line-height: 1.05;
  letter-spacing: -0.035em; max-width: 19ch; font-weight: 700;
}
.hero .lede {
  font-size: clamp(1rem, 2vw, 1.1875rem); line-height: 1.6;
  color: var(--ink-dim); max-width: 64ch; margin: 0 0 var(--s5);
}
.hero .lede strong { color: var(--ink); font-weight: 600; }

.chain { width: 100%; height: auto; display: block; margin: var(--s2) 0; }
.chain text { font-family: var(--mono); }

/* Capability and roadmap tiles. A left accent rule carries the grouping so
 * the tiles themselves can stay flat -- nine outlined boxes in a grid is
 * the thing that made the old page read as a form. */
.layer { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.layer .box {
  border: 1px solid var(--line); border-left: 3px solid var(--brand);
  border-radius: var(--radius-sm); padding: var(--s4); background: var(--surface);
  min-width: 0;
}
.layer .box h4 { margin: 0 0 var(--s1); font-size: var(--t-h3); font-weight: 600; letter-spacing: -0.01em; }
.layer .box p { margin: 0; font-size: var(--t-small); color: var(--ink-dim); line-height: 1.6; }
.layer .box .who {
  font-size: var(--t-micro); font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--brand-ink); margin-bottom: var(--s2);
}
/* The horizon reads off the accent, so "Later" is visibly further away
 * than "Near" without anyone reading the label. */
.layer .box.near { border-left-color: var(--ok); }
.layer .box.near .who { color: var(--ok); }
.layer .box.next { border-left-color: var(--brand); }
.layer .box.later { border-left-color: var(--ink-faint); }
.layer .box.later .who { color: var(--ink-faint); }

.aud { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.aud a {
  display: block; text-decoration: none; color: inherit;
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--s4) var(--s5); background: var(--surface);
  transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  min-width: 0;
}
.aud a:hover {
  border-color: var(--brand); transform: translateY(-2px);
  box-shadow: var(--shadow-2); text-decoration: none;
}
.aud h4 { margin: var(--s1) 0 0; font-size: 1rem; font-weight: 650; letter-spacing: -0.015em; }
.aud .role {
  font-size: var(--t-micro); font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--brand-ink);
}
/* The question in the customer's own words, set apart so it reads as a
 * quotation rather than as more body copy. */
.aud .ask {
  margin: var(--s3) 0 0; font-size: var(--t-body); color: var(--ink);
  padding-left: var(--s3); border-left: 2px solid var(--line);
}
.aud .ans { margin: var(--s2) 0 0; font-size: var(--t-small); color: var(--ink-dim); line-height: 1.6; }
.aud .go {
  margin-top: var(--s3); font-size: var(--t-small); font-weight: 600; color: var(--brand-ink);
  display: flex; align-items: center; gap: 5px;
}
.aud a:hover .go::after { transform: translateX(3px); }
.aud .go::after { content: '→'; transition: transform .15s ease; }
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
import {
  demo, el, card, table, pill, chrome, setPersona, readiness, callout,
} from '/shared/fleet.js';

const app = document.getElementById('app');
await chrome('/');

/* ------------------------------------------------------------------ hero */

app.append(el('section', { class: 'hero' },
  el('div', { class: 'kicker' }, 'Multi-tenant control plane for Huawei Ascend NPUs'),
  el('h1', {}, 'Turn a rack of NPUs into capacity you can rent by the second.'),
  el('p', { class: 'lede' },
    'Ascend Fleet is the software layer between Huawei’s hardware and the people who '
    + 'ultimately pay for compute. It takes raw Atlas servers and makes them ',
    el('strong', {}, 'multi-tenant, self-healing, metered and resellable'),
    ' — so a data centre can sell capacity to an AI company, which can sell it on to '
    + 'its own customers, with every device-second attributed and invoiced at each hop.'),
  el('p', { class: 'lede' },
    'Everything on these pages was ',
    el('strong', {}, 'recorded from a real control plane'),
    ' running on an Atlas 800I A2 with eight Ascend 910B3 cards. Nothing is a mock-up.')));

/* --------------------------------------------------------------- problem */

app.append(card('The problem',
  el('div', { class: 'cols two' },
    el('div', {},
      el('p', {},
        'A data centre that buys Ascend hardware owns a very expensive pool of devices and '
        + 'no way to sell access to it. Kubernetes schedules containers, not tenancies. It has '
        + 'no concept of who owns a card, what they agreed to pay, or how to stop one customer '
        + 'from seeing another.'),
      el('p', {},
        'So the fallback is dedicated clusters per customer: a card sits idle because it '
        + 'belongs to someone who is not using it tonight, and the operator carries the cost '
        + 'of every machine nobody is on.')),
    el('div', {},
      el('p', {},
        'The pieces to fix this exist on NVIDIA and barely exist on Ascend. The device plugin '
        + 'and scheduler are there; what is missing is everything above them — tenancy, '
        + 'quota, isolation, metering, billing, resale, audit, and an API a customer can '
        + 'build against.'),
      el('p', {},
        'That gap is what this is. It is deliberately not a fork of anything: it sits on top '
        + 'of Huawei’s own MindCluster stack and makes it sellable.')))));

/* ----------------------------------------------------------- value chain */

const chain = `
<svg class="chain" viewBox="0 0 980 232" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The value chain: Huawei supplies hardware to a data centre, which sells capacity to AI companies and enterprises, which serve their own end customers. Ascend Fleet is the layer that makes each hop meterable.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-size="11" fill="currentColor">
    <!-- layer boxes -->
    <g>
      <rect x="8"   y="34" width="188" height="66" rx="9" fill="none" stroke="currentColor" stroke-opacity=".32"/>
      <text x="22" y="56" font-weight="700">Huawei</text>
      <text x="22" y="74" fill-opacity=".72">Atlas 800 · Ascend 910B</text>
      <text x="22" y="90" fill-opacity=".72">CANN · MindCluster</text>
    </g>
    <g>
      <rect x="236" y="34" width="188" height="66" rx="9" fill="none" stroke="currentColor" stroke-opacity=".32"/>
      <text x="250" y="56" font-weight="700">Data centre</text>
      <text x="250" y="74" fill-opacity=".72">buys the racks,</text>
      <text x="250" y="90" fill-opacity=".72">sells the capacity</text>
    </g>
    <g>
      <rect x="464" y="34" width="188" height="66" rx="9" fill="none" stroke="currentColor" stroke-opacity=".32"/>
      <text x="478" y="56" font-weight="700">AI company</text>
      <text x="478" y="74" fill-opacity=".72">token factory, SaaS,</text>
      <text x="478" y="90" fill-opacity=".72">research lab</text>
    </g>
    <g>
      <rect x="692" y="34" width="188" height="66" rx="9" fill="none" stroke="currentColor" stroke-opacity=".32"/>
      <text x="706" y="56" font-weight="700">Their customers</text>
      <text x="706" y="74" fill-opacity=".72">teams, tenants,</text>
      <text x="706" y="90" fill-opacity=".72">API consumers</text>
    </g>
    <!-- arrows -->
    <g stroke="currentColor" stroke-opacity=".55" marker-end="url(#ar)" fill="none">
      <path d="M200 67 H230"/>
      <path d="M428 67 H458"/>
      <path d="M656 67 H686"/>
    </g>
    <text x="206" y="26" font-size="10" fill-opacity=".6">hardware</text>
    <text x="432" y="26" font-size="10" fill-opacity=".6">capacity</text>
    <text x="660" y="26" font-size="10" fill-opacity=".6">tokens / jobs</text>

    <!-- the platform band -->
    <rect x="236" y="128" width="644" height="60" rx="9" fill="currentColor" fill-opacity=".07"
          stroke="currentColor" stroke-opacity=".45"/>
    <text x="252" y="152" font-weight="700">Ascend Fleet</text>
    <text x="252" y="170" fill-opacity=".78">tenancy · quota · isolation · scheduling · metering · resale billing · audit</text>

    <g stroke="currentColor" stroke-opacity=".3" stroke-dasharray="3 3">
      <path d="M330 100 V128"/><path d="M558 100 V128"/><path d="M786 100 V128"/>
    </g>
    <text x="252" y="212" font-size="10" fill-opacity=".6">every hop is metered, quota-bounded and invoiced separately — this is the B2B2B2C part</text>
  </g>
</svg>`;

app.append(card('Where it sits',
  el('div', { html: chain }),
  el('p', { class: 'note' },
    'Huawei sells hardware. A data centre buys it and wants to sell capacity. Their customer '
    + 'is often itself a platform with customers of its own. Each of those hops is a separate '
    + 'commercial relationship, and each needs its own quota, its own isolation boundary and '
    + 'its own invoice — computed from the same device-seconds, without double-counting.')));

/* ---------------------------------------------------------- what it does */

app.append(card('What it does',
  el('div', { class: 'layer' },
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Tenancy'),
      el('h4', {}, 'Four levels deep'),
      el('p', {}, 'A tenant can have tenants. Quota is contained at every level, a parent is '
        + 'liable for what its children spend, and a child cannot escape the ceiling it was sold.')),
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Isolation'),
      el('h4', {}, 'Namespace, network, Pod Security'),
      el('p', {}, 'Each tenant gets a namespace, a Volcano queue, a ResourceQuota, a '
        + 'NetworkPolicy and a Pod Security Standard. A sub-tenant cannot open a path its '
        + 'parent closed.')),
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Scheduling'),
      el('h4', {}, 'Whole cards and slices'),
      el('p', {}, 'Gang-scheduled multi-card jobs through Volcano, plus vNPU slices for '
        + 'workloads that need a fraction of a card. Both metered the same way.')),
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Serving'),
      el('h4', {}, 'Autoscaling inference'),
      el('p', {}, 'A model runs as a long-lived endpoint that scales on real demand and stops '
        + 'at the quota ceiling. Demonstrated 1→4→1 on real hardware.')),
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Training'),
      el('h4', {}, 'Fine-tuning with storage'),
      el('p', {}, 'Datasets mounted read-only, checkpoints that outlive the pod, a sized '
        + '/dev/shm for DataLoader workers, and credentials injected rather than embedded.')),
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Metering'),
      el('h4', {}, 'Device-seconds, not estimates'),
      el('p', {}, 'Usage comes from observations actually made, never a PromQL integral. '
        + 'Periods close as meter-reading differences, so they always sum to the lifetime total.')),
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Billing'),
      el('h4', {}, 'Recursive, without double-counting'),
      el('p', {}, 'A reseller’s statement rolls its customers’ usage up to whoever '
        + 'pays, carrying the path. A rollup that counted a grandchild twice would look like '
        + 'a healthy business and be fraud.')),
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Trust'),
      el('h4', {}, 'An audit log the operator cannot rewrite'),
      el('p', {}, 'Hash-chained, Merkle-rooted, signed, and anchored into every closed '
        + 'invoice. Verification runs outside the server, so a customer can check it '
        + 'themselves.')),
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Operations'),
      el('h4', {}, 'Self-healing against a certified stack'),
      el('p', {}, 'Nodes are checked against the driver, firmware and CANN versions they are '
        + 'certified for. Drift cordons, drains and remediates rather than waiting for a '
        + 'ticket.')))));

/* ------------------------------------------------------------- audiences */

const AUD = [
  {
    role: 'Hardware vendor', name: 'Huawei',
    ask: '“Does this make our silicon easier to sell?”',
    ans: 'It is the commercial layer Ascend does not have. It builds on MindCluster and the '
       + 'Ascend device plugin rather than around them, and every finding we hit on real '
       + 'hardware is written down — including the ones that are upstream bugs.',
    href: '/console/', persona: 'demo-fleet-operator', go: 'See the fleet as an operator',
  },
  {
    role: 'Data centre / infrastructure', name: 'Sky47',
    ask: '“Can I rent this out, and will the invoice be defensible?”',
    ans: 'Tenants, quota, isolation and metering from device-seconds the platform actually '
       + 'observed. Closed periods are append-only and carry a signed audit checkpoint, so a '
       + 'customer disputing a bill can verify it without trusting you.',
    href: '/finance/', persona: 'demo-dc-shanghai-admin', go: 'See a reseller’s statement',
  },
  {
    role: 'AI factory / MaaS', name: 'Model-as-a-service platform',
    ask: '“Can I serve a model and resell it to my own users?”',
    ans: 'An endpoint that autoscales on live demand and never exceeds the NPUs you bought. '
       + 'Sub-tenancy means your customers are tenants of you, billed by you, invisible to '
       + 'each other.',
    href: '/serving/', persona: 'demo-maas-co-admin', go: 'Watch it scale 1→4→1',
  },
  {
    role: 'Enterprise / research', name: 'Fine-tuning and HPO',
    ask: '“Can my team actually run training here?”',
    ans: 'Gang-scheduled multi-card jobs with datasets, checkpoint storage, a sized /dev/shm '
       + 'and injected credentials. Engineers read their own logs; they cannot read your '
       + 'invoices.',
    href: '/workspace/', persona: 'demo-acme-engineer', go: 'Submit work as an engineer',
  },
  {
    role: 'Platform / channel partner', name: 'Reseller with sub-tenants',
    ask: '“How deep does the resale go?”',
    ans: 'Four levels. dc-shanghai sells to acme, acme sells to acme-research, and each hop '
       + 'is quota-contained and separately invoiced from the same device-seconds.',
    href: '/tenant/', persona: 'demo-dc-shanghai-admin', go: 'See the tenant tree',
  },
  {
    role: 'Security / compliance', name: 'Whoever signs off',
    ask: '“What stops the operator changing the numbers?”',
    ans: 'Every mutating call writes its intent before it acts. The trail is a hash chain '
       + 'with an RFC 6962 Merkle root, signed and anchored into invoices you keep. '
       + 'Verification is a separate binary, deliberately outside the server.',
    href: '/support/', persona: 'demo-fleet-operator', go: 'Inspect the audit trail',
  },
];

const audGrid = el('div', { class: 'aud' });
for (const a of AUD) {
  audGrid.append(el('a', {
    href: a.href,
    onclick: () => setPersona(a.persona),
  },
  el('div', { class: 'role' }, a.role),
  el('h4', {}, a.name),
  el('p', { class: 'ask' }, a.ask),
  el('p', { class: 'ans' }, a.ans),
  // The arrow is the stylesheet's, not the string's: .go::after draws it
  // and animates it on hover. Keeping one in the text too printed two.
  el('div', { class: 'go' }, a.go)));
}
app.append(card('Who it is for — and what to show them',
  el('p', { class: 'note' },
    'Each card opens the demo as the login that audience would have. The persona switcher in '
    + 'the header changes it at any time; the refusals you hit are real policy decisions, not '
    + 'hidden buttons.'),
  audGrid));

/* ----------------------------------------------------------------- proof */

app.append(card('Measured on the hardware, not estimated',
  el('div', { class: 'stats' },
    el('div', { class: 'stat' }, el('div', { class: 'k' }, 'Node'),
      el('div', { class: 'v' }, '1'), el('div', { class: 'n' }, 'Atlas 800I A2')),
    el('div', { class: 'stat' }, el('div', { class: 'k' }, 'NPUs'),
      el('div', { class: 'v' }, '8'), el('div', { class: 'n' }, 'Ascend 910B3')),
    el('div', { class: 'stat ok' }, el('div', { class: 'k' }, 'Tenants'),
      el('div', { class: 'v' }, '6'), el('div', { class: 'n' }, 'across 3 levels')),
    el('div', { class: 'stat' }, el('div', { class: 'k' }, 'KV cache'),
      el('div', { class: 'v' }, '35.5'), el('div', { class: 'n' }, 'GiB — 3.1M tokens')),
    el('div', { class: 'stat ok' }, el('div', { class: 'k' }, 'Throughput'),
      el('div', { class: 'v' }, '1501'), el('div', { class: 'n' }, 'tok/s at 64-way')),
    el('div', { class: 'stat' }, el('div', { class: 'k' }, 'Requests served'),
      el('div', { class: 'v' }, '4535'), el('div', { class: 'n' }, 'in the recorded run'))),
  callout('bad', 'And the number that is not flattering',
    el('p', {},
      'A new replica takes ', el('strong', {}, 'four to five minutes'),
      ' to start serving — the image is 9GB and vLLM compiles graphs and allocates '
      + 'its KV cache on first start.'),
    el('p', {},
      'In the recorded run the autoscaler went from 1 replica to 4 in 47 seconds, so '
      + 'four cards were held and billed. A ', el('strong', {}, 'second'),
      ' replica answered at t+258s — for ten seconds. The third and fourth '
      + 'never became ready at all, and at t+269s it scaled back to one. Four cards '
      + 'were held for about 330 seconds and at most two ever served.'),
    el('p', {},
      'A 4–5 minute cold start against a 120-second scale-down window tears replicas '
      + 'down before they finish starting. Autoscaling on this hardware is close to '
      + 'useless without a warm pool. That run is on the serving page because it is '
      + 'the clearest evidence for the top roadmap item, not because it went well.'))));

/* ------------------------------------------------------------- readiness */

app.append(card('Where it stands, honestly',
  el('p', { class: 'note', style: 'margin-bottom:16px' },
    'Three states, and the middle one is the honest one. ',
    el('strong', {}, 'Run'),
    ' means it has executed on real Ascend hardware. ',
    el('strong', {}, 'Partial'),
    ' means it works and has not been proven at the scale that matters. ',
    el('strong', {}, 'Designed'),
    ' means the shape, the validation and the tests exist and the thing that '
    + 'executes it does not — and where that is true, the API itself refuses '
    + 'rather than letting a console offer a button that does nothing.'),

  readiness([
    { state: 'run', kind: 'ok', title: 'Multi-tenant scheduling',
      detail: 'Whole cards and vNPU slices, gang-scheduled through Volcano, with per-tenant '
        + 'queues. Four replicas each received a distinct card with correct topology '
        + 'annotations.' },
    { state: 'run', kind: 'ok', title: 'Four-level tenancy',
      detail: 'Quota, network policy, Pod Security and vNPU templates all contained: a '
        + 'sub-tenant cannot exceed, or open a path its parent closed.' },
    { state: 'run', kind: 'ok', title: 'Autoscaling inference',
      detail: '1 → 4 → 1 on a recorded run, capped by the quota ceiling rather than by '
        + 'demand. 4535 requests at 1501 tok/s.' },
    { state: 'run', kind: 'ok', title: 'Metering and recursive billing',
      detail: 'Device-seconds from observations, never a PromQL integral. A real period '
        + 'closed at 665.12 USD and a reseller statement at 720.89 across three '
        + 'sub-tenants.' },
    { state: 'run', kind: 'ok', title: 'Tamper-evident audit',
      detail: 'Hash chain, RFC 6962 Merkle tree, Ed25519-signed checkpoints anchored onto '
        + 'closed periods. Verified, and a forged trail refused.' },
    { state: 'run', kind: 'ok', title: 'OIDC through Keycloak',
      detail: 'Eight real logins, scoped end to end. Five defects were found by one real '
        + 'token that no test tier could catch.' },
    { state: 'run', kind: 'ok', title: 'Fine-tuning storage and credentials',
      detail: 'PVCs, ConfigMaps, a sized memory-backed /dev/shm, and credentials mounted '
        + 'rather than placed in the job environment.' },
    { state: 'run', kind: 'ok', title: 'Workload catalog',
      detail: 'Seven named shapes with typed parameters, so nobody types an extended '
        + 'resource name. A console renders the form from the server.' },
    { state: 'run', kind: 'ok', title: 'Per-caller API keys',
      detail: 'Hash-only storage, constant-time comparison, roles a closed list. An invoke '
        + 'key can be scoped to one endpoint, which is what makes reselling safe.' },
    { state: 'run', kind: 'ok', title: 'Token metering',
      detail: 'The reseller’s meter, above device-seconds. Survives the autoscaler '
        + 'destroying replicas, which is where a naive implementation loses the revenue.' },

    { state: 'partial', kind: 'warn', title: 'Self-healing',
      detail: 'The drift loop runs and is visible on the console. It has never been proven '
        + 'against a second node, because there has only ever been one — there is '
        + 'nowhere to drain to.' },
    { state: 'partial', kind: 'warn', title: 'Scale',
      detail: 'Measured to 8 cards on one node. Cross-cluster placement is refused in code '
        + 'until a second cluster validates it, rather than claimed.' },
    { state: 'partial', kind: 'warn', title: 'Reservations',
      detail: 'The admission ledger is built and tested — peak commitment across overlapping '
        + 'windows, half-open intervals, "no but Tuesday" on a refusal. The controller '
        + 'that holds the capacity is not written.' },
    { state: 'partial', kind: 'warn', title: 'Engine health',
      detail: 'Found on the pilot while writing this: vLLM’s engine core can die while its '
        + 'HTTP server keeps answering /health 200 and exits 0. The endpoint reported '
        + 'Ready through seven restarts. Readiness needs to reflect the engine, not '
        + 'the web server.' },

    { state: 'designed', kind: '', title: 'Public endpoint address',
      detail: 'INGRESS AND TLS. spec.route validates — TLS and an API key are both '
        + 'mandatory on a published route, and there is deliberately no flag to serve '
        + 'one in plaintext — and nothing yet creates the Ingress object. Until it '
        + 'does, an endpoint is reachable only from inside its own namespace, and '
        + 'nothing about model-as-a-service is real. First item on the roadmap.' },
    { state: 'designed', kind: '', title: 'Scale to zero',
      detail: 'THE ACTIVATOR. spec.scaleToZero configures it and the autoscaler honours its '
        + 'wake signal, but the request-holding proxy that sends it is not deployed. '
        + 'Until it is, minReplicas: 0 is refused by the webhook — which is the '
        + 'correct failure, because it used to be accepted with a warning about a '
        + '“cold start” and the endpoint never came back at all.' },
    { state: 'designed', kind: '', title: 'Notebooks and dev boxes',
      detail: 'The Workspace type, its validation and its catalog templates are built and '
        + 'tested; the controller that turns one into a pod, a service and an idle '
        + 'reaper is not. The catalog serves both templates with no submit route, so '
        + 'nothing can offer them by accident.' },
    { state: 'designed', kind: '', title: 'Real virtual machines',
      detail: 'NOT BUILT, AND NOT WHAT THE DEV BOX IS. A dev box is a container with a '
        + 'shell, your keys and a card — which is what VS Code Remote, rsync and a '
        + 'Makefile actually need. A real VM with device passthrough means KubeVirt, '
        + 'a kernel per tenant and snapshots, and none of that is here. Saying '
        + '“VMs” today would be a different product.' },
    { state: 'designed', kind: '', title: 'Warm pools and KV-cache reuse',
      detail: 'The 258-second cold start is the single biggest gap between this and a '
        + 'commercial inference product. A warm floor and prefix-cache reuse across '
        + 'replicas are the answer and neither exists.' },
    { state: 'designed', kind: '', title: 'Observability',
      detail: 'Nothing scrapes the metrics the manager exposes. No Prometheus, no Grafana, '
        + 'no history — so every number on these pages is a point reading rather than '
        + 'a trend.' },
    { state: 'designed', kind: '', title: 'Self-service onboarding',
      detail: 'A reseller creating its own customers through the API, with its own margin, '
        + 'is what makes the channel a business rather than a support queue. Tenants '
        + 'are created by the operator applying YAML.' },
  ]),

  callout('warn', 'Read this section first if you are evaluating us',
    el('p', {},
      'Four of the seven “designed” rows above are what stand between this and a product '
      + 'somebody can buy: an ingress, an activator, a Workspace controller and a warm '
      + 'pool. Each is small next to what already works, and none of them is hand-waved — '
      + 'the types, the validation and the tests are in the repository, which is why they '
      + 'are listed as designed rather than as roadmap.')),

  el('p', { class: 'note' },
    'The full list, checked against the code rather than remembered, is in ',
    el('a', { href: 'https://github.com/Arqamz/npu-orchestration-demo/blob/main/docs/WHAT-IS-MISSING.md' },
      'WHAT-IS-MISSING.md'), ' and in ',
    el('a', { href: 'https://github.com/Arqamz/npu-orchestration/blob/main/docs/HANDBOOK.md' },
      'the handbook'), '.')));

/* ------------------------------------------------------------ what next */

const horizon = (kind, when, title, body) => el('div', { class: `box ${kind}` },
  el('div', { class: 'who' }, when),
  el('h4', {}, title),
  el('p', {}, body));

app.append(card('What comes next, in order',
  el('p', { class: 'note', style: 'margin-bottom:16px' },
    'Ordered by what unlocks the most, not by what is easiest. The first three are '
    + 'the difference between a control plane and a product somebody can buy.'),
  el('div', { class: 'layer' },
    horizon('near', 'Next — unblocks three things',
      'Ingress, TLS and a hostname per endpoint',
      'Nothing about model-as-a-service is real until a customer outside the cluster can '
      + 'call the endpoint. The route policy is already validated and already refuses '
      + 'plaintext and anonymous access; what is missing is the object that publishes it. '
      + 'It also unlocks notebooks and dev boxes, which need exactly the same path in.'),
    horizon('near', 'Next',
      'The activator, and a warm floor',
      'A proxy that holds the first request while a replica starts. It makes scale-to-zero '
      + 'real rather than refused, and it is where prefix-cache reuse and a warm pool '
      + 'belong — which is the answer to the 258-second cold start that is currently the '
      + 'most honest number on this site.'),
    horizon('near', 'Next',
      'The Workspace controller',
      'Notebooks and SSH dev boxes, with the idle reaper that makes them affordable. A card '
      + 'costs the same behind an idle browser tab as it does training; every platform that '
      + 'offered notebooks without a reaper either ate that or billed for it and lost the '
      + 'customer.'),
    horizon('next', 'Then',
      'The reservation controller',
      '“64 cards for three months” is how capacity is actually sold, and a quota is a limit '
      + 'rather than a promise. The admission ledger that decides whether a commitment can '
      + 'be met is built and tested; what is missing is the thing that holds the capacity '
      + 'it promised.'),
    horizon('next', 'Then',
      'Prometheus, Grafana and a history',
      'Nothing scrapes what the manager already exposes, so every figure is a point reading. '
      + 'Utilisation over time is both the operator’s commercial signal and the first thing '
      + 'a customer asks for.'),
    horizon('next', 'Then',
      'Multi-cluster, multi-site',
      'The CRDs exist and cross-cluster scheduling is deliberately refused until a second '
      + 'cluster validates it. That refusal is what turns one data centre into a fleet, '
      + 'honestly, rather than a claim.'),
    horizon('later', 'Later',
      'Real virtual machines',
      'KubeVirt, a kernel per tenant, device passthrough and snapshots — for customers whose '
      + 'compliance regime will not accept a shared kernel. Deliberately not conflated with '
      + 'the dev box, which is a container and is honest about it.'),
    horizon('later', 'Later',
      'Self-service onboarding',
      'A reseller creating its own customers through the API, with its own margin and its own '
      + 'rate card, is what makes the channel a business rather than a support queue.'),
    horizon('later', 'Later',
      'A marketplace of certified stacks',
      'Nodes are already validated against a CertifiedStack. The same mechanism could publish '
      + 'vetted model and framework images per hardware generation — the thing that makes a '
      + 'preferred-partner reference architecture worth the name.'))));

/* ------------------------------------------------------------- the demo */

const personas = (await demo.personas()).body || [];
app.append(card('Every login in this demo',
  el('p', { class: 'note' },
    'Captured through each persona’s own Keycloak token, so a page shows exactly what '
    + 'that login returns — including the endpoints it is refused.'),
  table(['Login', 'Role', 'Operator', 'Tenant admin', 'Reaches'],
    personas,
    (p) => el('tr', {},
      el('td', {}, el('a', {
        href: '#', onclick: (e) => { e.preventDefault(); setPersona(p.token); location.href = '/console/'; },
      }, el('strong', {}, p.username))),
      el('td', { class: 'muted' }, p.role),
      el('td', {}, p.operator ? pill('yes', 'ok') : el('span', { class: 'muted' }, '—')),
      el('td', {}, p.tenantAdmin ? pill('yes', 'policy') : el('span', { class: 'muted' }, '—')),
      el('td', { class: 'mono muted' }, (p.reach || []).join(', ') || '—')))));

app.append(card('How the demo is built',
  el('p', {},
    'The bodies are replayed from recordings. Everything else is the real thing: the routes, '
    + 'the bearer authentication, the closed-list scope policy, the status codes, the refusals '
    + 'and the state a mutation leaves behind. The policy file mirrors the Go control plane’s, '
    + 'so a flow that works here works against the real API.'),
  el('p', { class: 'note' },
    'Nothing is synthesised. Where a field was never captured it is absent here too, because a '
    + 'demo that fills in a plausible number is a mock-up of a product that does not exist.'),
  el('div', { class: 'row', style: 'margin-top:12px' },
    el('a', { class: 'btn', href: 'https://github.com/Arqamz/npu-orchestration' }, 'Control plane →'),
    el('a', { class: 'btn', href: 'https://github.com/Arqamz/npu-orchestration-demo' }, 'This demo →'),
    el('a', { class: 'btn', href: 'https://github.com/Arqamz/npu-orchestration-demo/blob/main/docs/API-SURFACE.md' }, 'API surface →'))));
</script>
