<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascend Fleet</title>
<link rel="stylesheet" href="/shared/fleet.css">
<style>
/* Page-specific: the pitch layout. Everything reusable is in fleet.css, and
 * these now take their type, space and depth from the same tokens rather
 * than hard-coding a second, slightly different scale. */

.hero { padding: var(--s8) 0 var(--s6); margin-bottom: var(--s6); position: relative; }
/* A quiet wash behind the hero rather than a rule under it. A 1px line
 * across the top of a pitch page reads as a form; a gradient reads as a
 * surface the content sits on. */
.hero::before {
  content: ''; position: absolute; inset: calc(-1 * var(--s6)) -50vw 0;
  background: radial-gradient(70ch 40ch at 20% 0%, var(--brand-wash), transparent 70%);
  pointer-events: none; z-index: -1;
}
.hero .kicker {
  display: inline-flex; align-items: center; gap: var(--s2);
  font-size: var(--t-micro); font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--brand-ink);
  padding: 4px 10px; border: 1px solid var(--brand); border-radius: var(--radius-pill);
  background: var(--brand-wash); margin-bottom: var(--s4);
}
.hero h1 {
  margin: 0 0 var(--s4); font-size: clamp(2rem, 5vw, 3.25rem); line-height: 1.05;
  letter-spacing: -0.035em; max-width: 19ch; font-weight: 700;
}
.hero .lede {
  font-size: clamp(1rem, 2vw, 1.1875rem); line-height: 1.6;
  color: var(--ink-dim); max-width: 64ch; margin: 0 0 var(--s5);
}
.hero .lede strong { color: var(--ink); font-weight: 600; }

.chain { width: 100%; height: auto; display: block; margin: var(--s2) 0; }
.chain text { font-family: var(--mono); }

/* Capability and roadmap tiles. A left accent rule carries the grouping so
 * the tiles themselves can stay flat -- nine outlined boxes in a grid is
 * the thing that made the old page read as a form. */
.layer { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.layer .box {
  border: 1px solid var(--line); border-left: 3px solid var(--brand);
  border-radius: var(--radius-sm); padding: var(--s4); background: var(--surface);
  min-width: 0;
}
.layer .box h4 { margin: 0 0 var(--s1); font-size: var(--t-h3); font-weight: 600; letter-spacing: -0.01em; }
.layer .box p { margin: 0; font-size: var(--t-small); color: var(--ink-dim); line-height: 1.6; }
.layer .box .who {
  font-size: var(--t-micro); font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--brand-ink); margin-bottom: var(--s2);
}
/* The horizon reads off the accent, so "Later" is visibly further away
 * than "Near" without anyone reading the label. */
.layer .box.near { border-left-color: var(--ok); }
.layer .box.near .who { color: var(--ok); }
.layer .box.next { border-left-color: var(--brand); }
.layer .box.later { border-left-color: var(--ink-faint); }
.layer .box.later .who { color: var(--ink-faint); }

.aud { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.aud a {
  display: block; text-decoration: none; color: inherit;
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--s4) var(--s5); background: var(--surface);
  transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  min-width: 0;
}
.aud a:hover {
  border-color: var(--brand); transform: translateY(-2px);
  box-shadow: var(--shadow-2); text-decoration: none;
}
.aud h4 { margin: var(--s1) 0 0; font-size: 1rem; font-weight: 650; letter-spacing: -0.015em; }
.aud .role {
  font-size: var(--t-micro); font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--brand-ink);
}
/* The question in the customer's own words, set apart so it reads as a
 * quotation rather than as more body copy. */
.aud .ask {
  margin: var(--s3) 0 0; font-size: var(--t-body); color: var(--ink);
  padding-left: var(--s3); border-left: 2px solid var(--line);
}
.aud .ans { margin: var(--s2) 0 0; font-size: var(--t-small); color: var(--ink-dim); line-height: 1.6; }
.aud .go {
  margin-top: var(--s3); font-size: var(--t-small); font-weight: 600; color: var(--brand-ink);
  display: flex; align-items: center; gap: 5px;
}
.aud a:hover .go::after { transform: translateX(3px); }
.aud .go::after { content: '→'; transition: transform .15s ease; }
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
import {
  demo, el, card, table, pill, chrome, setPersona, readiness, callout, section, flow,
} from '/shared/fleet.js';

const app = document.getElementById('app');
await chrome('/');

/* ------------------------------------------------------------------ hero */

app.append(el('section', { class: 'hero' },
  el('div', { class: 'kicker' }, 'Multi-tenant control plane for Huawei Ascend NPUs'),
  el('h1', {}, 'Turn a rack of NPUs into capacity you can rent by the second.'),
  el('p', { class: 'lede' },
    'Ascend Fleet is the software layer between Huawei’s hardware and the people who '
    + 'ultimately pay for compute. It takes raw Atlas servers and makes them ',
    el('strong', {}, 'multi-tenant, self-healing, metered and resellable'),
    ' — so a data centre can sell capacity to an AI company, which can sell it on to '
    + 'its own customers, with every device-second attributed and invoiced at each hop.'),
  el('p', { class: 'lede' },
    'Everything on these pages was ',
    el('strong', {}, 'recorded from a real control plane'),
    ' running on an Atlas 800I A2 with eight Ascend 910B3 cards. Nothing is a mock-up.')));

/* ------------------------------------------------------- what this IS */

/* THE SECTION A DEMO AUDIENCE READS FIRST.
 *
 * Everything below this used to describe the product. Nothing said which
 * parts of it exist, so a reader could leave believing notebooks, dev
 * boxes and self-service onboarding were things they could use. They are
 * not. Four states, stated before anything else on the page:
 *
 *   RUNNING   executed on the pilot hardware; there is a recording
 *   TESTED    code and tests exist; never run against cards
 *   DESIGNED  a shape and its validation; NOTHING TO SHOW
 *   ABSENT    not started
 *
 * The distinction that matters most is TESTED vs DESIGNED vs ABSENT,
 * because all three are easy to present as "built".
 */

const STATES = {
  running: ['running', 'ok'],
  tested: ['tested, not run', 'warn'],
  designed: ['designed only', ''],
  absent: ['not started', 'bad'],
};

const deliverable = (state, title, detail, evidence) => el('tr', {},
  el('td', {}, pill(...STATES[state])),
  el('td', { class: 'wrap' }, el('strong', {}, title)),
  el('td', { class: 'wrap' }, detail),
  el('td', { class: 'wrap faint', style: 'font-size:12px' }, evidence));

app.append(section('What is actually built, in plain terms',
  'Read this before anything else on the page. Everything below describes the product; '
  + 'this says which parts of it exist today, and how we know.',

  callout('warn', 'What this demo is, and what it is not',
    el('p', {},
      'It is a ', el('strong', {}, 'control plane'),
      ' — the layer that turns a rack of Ascend cards into tenancies, quotas, scheduled '
      + 'work, metered usage and invoices. It ran on one Atlas 800I A2 with eight 910B3 '
      + 'cards, and every screen here replays a response that machine actually gave.'),
    el('p', {},
      'It is ', el('strong', {}, 'not a product you could sell access to on Monday'),
      '. It ran on a single node with node-local disk and no object storage, no metrics '
      + 'history, and no way for a customer outside the cluster to reach an endpoint. '
      + 'Those are listed below rather than left to be discovered.')),

  el('h3', { style: 'margin:24px 0 8px' }, 'Running — executed on the pilot hardware'),
  el('p', { class: 'note', style: 'margin-bottom:12px' },
    'Each of these has a recording behind it, which is what the screens replay.'),
  el('div', { class: 'card flush' }, table(
    [{ label: 'State' }, { label: 'Capability' }, { label: 'What it does' },
      { label: 'How we know' }],
    [
      ['running', 'Multi-tenant scheduling',
        'Whole cards and quarter-card vNPU slices, gang-scheduled per tenant.',
        'Four replicas each took a distinct card with correct topology annotations.'],
      ['running', 'Four-level tenancy',
        'Operator → data centre → AI company → its customers, each contained.',
        'Six tenancies across three levels; quota, network and Pod Security all held.'],
      ['running', 'Job submission',
        'Submit work with volumes, config and injected credentials; read your own logs.',
        'Jobs ran on cards. Mounts and secrets covered by tests.'],
      ['running', 'Autoscaling inference',
        'An endpoint that adds and removes replicas with load, capped by quota.',
        'A recorded run — and it went BADLY. See the warning below.'],
      ['running', 'Metering and recursive billing',
        'Device-seconds from observations; usage rolled up to whoever pays.',
        'A period closed at 665.12 USD; a reseller statement at 720.89 over 3 sub-tenants.'],
      ['running', 'Tamper-evident audit',
        'Hash chain, RFC 6962 Merkle tree, signed checkpoints anchored onto invoices.',
        'Verified end to end, and a deliberately forged trail was refused.'],
      ['running', 'OIDC login and scoping',
        'Real Keycloak tokens; every route narrowed to what the caller may see.',
        'Eight logins. Five real defects were found by one real token.'],
      ['running', 'Certified-stack drift detection',
        'Notices a node whose driver/firmware/CANN left its approved set.',
        'Detected a real CANN drift (8.5.2 → 8.5.1) on the pilot node.'],
    ],
    (r) => deliverable(r[0], r[1], r[2], r[3]))),

  callout('bad', 'The autoscaling run did not go well, and we show it anyway',
    el('p', {},
      'At t+47s it went from 1 replica to 4, so four cards were held and billed. A second '
      + 'replica answered at t+258s — for ten seconds. The third and fourth never became '
      + 'ready at all. Four cards were held for about 330 seconds and at most two ever '
      + 'served.'),
    el('p', {},
      'A 4–5 minute cold start against a 120-second scale-down window tears replicas down '
      + 'before they finish starting. ', el('strong', {},
        'Autoscaling on this hardware is close to useless without a warm pool, which does '
        + 'not exist yet.'),
      ' That is the single most important finding in this demo.')),

  el('h3', { style: 'margin:28px 0 8px' }, 'Tested, but never run against cards'),
  el('p', { class: 'note', style: 'margin-bottom:12px' },
    'Written and covered by tests in the control plane, including negative controls. The '
    + 'pilot node’s cards were released before these could be exercised on hardware, so '
    + 'there is no recording — the screens describe them rather than replaying them.'),
  el('div', { class: 'card flush' }, table(
    [{ label: 'State' }, { label: 'Capability' }, { label: 'What it does' },
      { label: 'How we know' }],
    [
      ['tested', 'Workload catalog',
        'Named templates so nobody types an extended resource name.',
        'Served live at /fleet/catalog; every template decodes into the real request type.'],
      ['tested', 'Per-caller API keys',
        'Long-lived credentials for applications, scoped to one endpoint.',
        'Hash-only storage, constant-time compare, 12 negative controls.'],
      ['tested', 'Token metering',
        'The reseller’s meter — prompt and completion tokens, priced per million.',
        'Survives replica destruction; 11 negative controls.'],
      ['tested', 'Reservation admission',
        'Decides whether committed capacity can be promised without double-selling.',
        'Peak-over-window arithmetic; 9 negative controls. No controller holds it.'],
      ['tested', 'Scale-to-zero logic',
        'Releasing the last replica and waking on a request.',
        'Autoscaler honours a wake signal; nothing sends one yet (no activator).'],
    ],
    (r) => deliverable(r[0], r[1], r[2], r[3]))),

  el('h3', { style: 'margin:28px 0 8px' }, 'Designed only — there is nothing to show'),
  el('p', { class: 'note', style: 'margin-bottom:12px' },
    'A type, its validation and its tests exist. Nothing creates the thing. If somebody '
    + 'asks to see one of these in the demo, the honest answer is that you cannot — and '
    + 'the API itself refuses, which is why there is no button for them anywhere.'),
  el('div', { class: 'card flush' }, table(
    [{ label: 'State' }, { label: 'Capability' }, { label: 'What exists' },
      { label: 'What is missing' }],
    [
      ['designed', 'Notebook as a service',
        'The Workspace type, its validation, and a catalog template.',
        'The controller that creates the pod, the service and the idle reaper.'],
      ['designed', 'Dev box (SSH)',
        'Same type; a container with a shell and a card. NOT a virtual machine.',
        'The same controller, plus a TCP route the HTTP ingress does not provide.'],
      ['designed', 'Reservations',
        'The admission ledger that decides whether a promise can be met.',
        'The controller that actually holds the capacity it promised.'],
      ['designed', 'Scale to zero',
        'The policy and the autoscaler’s wake path.',
        'The activator — a proxy that holds the first request while a replica starts.'],
      ['absent', 'Self-service onboarding',
        'Nothing. A reseller cannot create its own customers.',
        'Tenancies are created by the operator applying YAML on their behalf.'],
      ['absent', 'Real virtual machines',
        'Nothing. The dev box is a container and we do not call it a VM.',
        'KubeVirt, a kernel per tenant, device passthrough, snapshots.'],
    ],
    (r) => deliverable(r[0], r[1], r[2], r[3]))),

  el('h3', { style: 'margin:28px 0 8px' }, 'Missing before any of this is production'),
  el('p', { class: 'note', style: 'margin-bottom:12px' },
    'Infrastructure the pilot never had. None of it is hard; all of it is required, and '
    + 'none of it is visible in a demo that runs on one machine.'),
  el('div', { class: 'card flush' }, table(
    [{ label: 'Gap' }, { label: 'What the pilot had' }, { label: 'Why it blocks production' }],
    [
      ['More than one node',
        'One Atlas 800I A2. Eight cards, one control plane, no second machine.',
        'Self-healing has nowhere to drain to, so it is armed and unproven. Nothing larger '
        + 'than 8 cards has ever been scheduled. Cross-cluster placement is refused in '
        + 'code rather than claimed.'],
      ['Shared storage',
        'One storage class: k3s local-path. Node-local disk, ReadWriteOnce, no expansion.',
        'A volume is pinned to the disk of one machine. Two pods cannot share a dataset, '
        + 'and on a second node a job simply could not reach its data. Distributed '
        + 'training needs ReadWriteMany; there is no CSI driver, no NFS, no Ceph.'],
      ['Object storage',
        'None. No S3, no MinIO, no bucket of any kind.',
        'Model weights and checkpoints have nowhere durable or shared to live. Today a '
        + 'model is downloaded onto one node’s disk, which is why every replica restart '
        + 'pays for it again.'],
      ['Metrics and history',
        'The manager exposes metrics. Nothing scrapes them.',
        'No Prometheus, no Grafana, no retention. Every number on these pages is a point '
        + 'reading — there is no utilisation over time, which is both the operator’s '
        + 'commercial signal and the first thing a customer asks for.'],
      ['A way in from outside',
        'ClusterIP services only. No ingress controller, no TLS termination, no DNS.',
        'A customer outside the cluster cannot call an endpoint at all, so nothing about '
        + 'model-as-a-service is real yet.'],
      ['A highly available control plane',
        'One k3s server, one manager replica, SQLite-backed.',
        'The control plane is a single point of failure. Leader election exists in the '
        + 'manager; the cluster underneath it does not survive the node.'],
      ['Backup and disaster recovery',
        'None. The audit trail and closed periods sit on one PVC on one disk.',
        'Losing the node loses the billing record. The audit design survives tampering; '
        + 'it does not survive a disk.'],
    ],
    (r) => el('tr', {},
      el('td', { class: 'wrap' }, el('strong', {}, r[0])),
      el('td', { class: 'wrap' }, r[1]),
      el('td', { class: 'wrap faint' }, r[2]))))));

/* --------------------------------------------------------------- problem */

app.append(card('The problem',
  el('div', { class: 'cols two' },
    el('div', {},
      el('p', {},
        'A data centre that buys Ascend hardware owns a very expensive pool of devices and '
        + 'no way to sell access to it. Kubernetes schedules containers, not tenancies. It has '
        + 'no concept of who owns a card, what they agreed to pay, or how to stop one customer '
        + 'from seeing another.'),
      el('p', {},
        'So the fallback is dedicated clusters per customer: a card sits idle because it '
        + 'belongs to someone who is not using it tonight, and the operator carries the cost '
        + 'of every machine nobody is on.')),
    el('div', {},
      el('p', {},
        'The pieces to fix this exist on NVIDIA and barely exist on Ascend. The device plugin '
        + 'and scheduler are there; what is missing is everything above them — tenancy, '
        + 'quota, isolation, metering, billing, resale, audit, and an API a customer can '
        + 'build against.'),
      el('p', {},
        'That gap is what this is. It is deliberately not a fork of anything: it sits on top '
        + 'of Huawei’s own MindCluster stack and makes it sellable.')))));

/* ----------------------------------------------------------- value chain */

const chain = `
<svg class="chain" viewBox="0 0 980 232" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The value chain: Huawei supplies hardware to a data centre, which sells capacity to AI companies and enterprises, which serve their own end customers. Ascend Fleet is the layer that makes each hop meterable.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-size="11" fill="currentColor">
    <!-- layer boxes -->
    <g>
      <rect x="8"   y="34" width="188" height="66" rx="9" fill="none" stroke="currentColor" stroke-opacity=".32"/>
      <text x="22" y="56" font-weight="700">Huawei</text>
      <text x="22" y="74" fill-opacity=".72">Atlas 800 · Ascend 910B</text>
      <text x="22" y="90" fill-opacity=".72">CANN · MindCluster</text>
    </g>
    <g>
      <rect x="236" y="34" width="188" height="66" rx="9" fill="none" stroke="currentColor" stroke-opacity=".32"/>
      <text x="250" y="56" font-weight="700">Data centre</text>
      <text x="250" y="74" fill-opacity=".72">buys the racks,</text>
      <text x="250" y="90" fill-opacity=".72">sells the capacity</text>
    </g>
    <g>
      <rect x="464" y="34" width="188" height="66" rx="9" fill="none" stroke="currentColor" stroke-opacity=".32"/>
      <text x="478" y="56" font-weight="700">AI company</text>
      <text x="478" y="74" fill-opacity=".72">token factory, SaaS,</text>
      <text x="478" y="90" fill-opacity=".72">research lab</text>
    </g>
    <g>
      <rect x="692" y="34" width="188" height="66" rx="9" fill="none" stroke="currentColor" stroke-opacity=".32"/>
      <text x="706" y="56" font-weight="700">Their customers</text>
      <text x="706" y="74" fill-opacity=".72">teams, tenants,</text>
      <text x="706" y="90" fill-opacity=".72">API consumers</text>
    </g>
    <!-- arrows -->
    <g stroke="currentColor" stroke-opacity=".55" marker-end="url(#ar)" fill="none">
      <path d="M200 67 H230"/>
      <path d="M428 67 H458"/>
      <path d="M656 67 H686"/>
    </g>
    <text x="206" y="26" font-size="10" fill-opacity=".6">hardware</text>
    <text x="432" y="26" font-size="10" fill-opacity=".6">capacity</text>
    <text x="660" y="26" font-size="10" fill-opacity=".6">tokens / jobs</text>

    <!-- the platform band -->
    <rect x="236" y="128" width="644" height="60" rx="9" fill="currentColor" fill-opacity=".07"
          stroke="currentColor" stroke-opacity=".45"/>
    <text x="252" y="152" font-weight="700">Ascend Fleet</text>
    <text x="252" y="170" fill-opacity=".78">tenancy · quota · isolation · scheduling · metering · resale billing · audit</text>

    <g stroke="currentColor" stroke-opacity=".3" stroke-dasharray="3 3">
      <path d="M330 100 V128"/><path d="M558 100 V128"/><path d="M786 100 V128"/>
    </g>
    <text x="252" y="212" font-size="10" fill-opacity=".6">every hop is metered, quota-bounded and invoiced separately — this is the B2B2B2C part</text>
  </g>
</svg>`;

app.append(card('Where it sits',
  el('div', { html: chain }),
  el('p', { class: 'note' },
    'Huawei sells hardware. A data centre buys it and wants to sell capacity. Their customer '
    + 'is often itself a platform with customers of its own. Each of those hops is a separate '
    + 'commercial relationship, and each needs its own quota, its own isolation boundary and '
    + 'its own invoice — computed from the same device-seconds, without double-counting.')));

/* ---------------------------------------------------------- what it does */

app.append(card('What it does',
  el('div', { class: 'layer' },
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Tenancy'),
      el('h4', {}, 'Four levels deep'),
      el('p', {}, 'A tenant can have tenants. Quota is contained at every level, a parent is '
        + 'liable for what its children spend, and a child cannot escape the ceiling it was sold.')),
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Isolation'),
      el('h4', {}, 'Namespace, network, Pod Security'),
      el('p', {}, 'Each tenant gets a namespace, a Volcano queue, a ResourceQuota, a '
        + 'NetworkPolicy and a Pod Security Standard. A sub-tenant cannot open a path its '
        + 'parent closed.')),
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Scheduling'),
      el('h4', {}, 'Whole cards and slices'),
      el('p', {}, 'Gang-scheduled multi-card jobs through Volcano, plus vNPU slices for '
        + 'workloads that need a fraction of a card. Both metered the same way.')),
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Serving'),
      el('h4', {}, 'Autoscaling inference'),
      el('p', {}, 'A model runs as a long-lived endpoint that scales on real demand and stops '
        + 'at the quota ceiling. Demonstrated 1→4→1 on real hardware.')),
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Training'),
      el('h4', {}, 'Fine-tuning with storage'),
      el('p', {}, 'Datasets mounted read-only, checkpoints that outlive the pod, a sized '
        + '/dev/shm for DataLoader workers, and credentials injected rather than embedded.')),
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Metering'),
      el('h4', {}, 'Device-seconds, not estimates'),
      el('p', {}, 'Usage comes from observations actually made, never a PromQL integral. '
        + 'Periods close as meter-reading differences, so they always sum to the lifetime total.')),
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Billing'),
      el('h4', {}, 'Recursive, without double-counting'),
      el('p', {}, 'A reseller’s statement rolls its customers’ usage up to whoever '
        + 'pays, carrying the path. A rollup that counted a grandchild twice would look like '
        + 'a healthy business and be fraud.')),
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Trust'),
      el('h4', {}, 'An audit log the operator cannot rewrite'),
      el('p', {}, 'Hash-chained, Merkle-rooted, signed, and anchored into every closed '
        + 'invoice. Verification runs outside the server, so a customer can check it '
        + 'themselves.')),
    el('div', { class: 'box' },
      el('div', { class: 'who' }, 'Operations'),
      el('h4', {}, 'Self-healing against a certified stack'),
      el('p', {}, 'Nodes are checked against the driver, firmware and CANN versions they are '
        + 'certified for. Drift cordons, drains and remediates rather than waiting for a '
        + 'ticket.')))));

/* ------------------------------------------------------------- audiences */

const AUD = [
  {
    role: 'Hardware vendor', name: 'Huawei',
    ask: '“Does this make our silicon easier to sell?”',
    ans: 'It is the commercial layer Ascend does not have. It builds on MindCluster and the '
       + 'Ascend device plugin rather than around them, and every finding we hit on real '
       + 'hardware is written down — including the ones that are upstream bugs.',
    href: '/console/', persona: 'demo-fleet-operator', go: 'See the fleet as an operator',
  },
  {
    role: 'Data centre / infrastructure', name: 'Sky47',
    ask: '“Can I rent this out, and will the invoice be defensible?”',
    ans: 'Tenants, quota, isolation and metering from device-seconds the platform actually '
       + 'observed. Closed periods are append-only and carry a signed audit checkpoint, so a '
       + 'customer disputing a bill can verify it without trusting you.',
    href: '/finance/', persona: 'demo-dc-shanghai-admin', go: 'See a reseller’s statement',

      + 'compliance regime will not accept a shared kernel. Deliberately not conflated with '
      + 'the dev box, which is a container and is honest about it.'),
    horizon('later', 'Later',
      'Self-service onboarding',
      'A reseller creating its own customers through the API, with its own margin and its own '
      + 'rate card, is what makes the channel a business rather than a support queue.'),
    horizon('later', 'Later',
      'A marketplace of certified stacks',
      'Nodes are already validated against a CertifiedStack. The same mechanism could publish '
      + 'vetted model and framework images per hardware generation — the thing that makes a '
      + 'preferred-partner reference architecture worth the name.'))));

/* ------------------------------------------------------------- the demo */

const personas = (await demo.personas()).body || [];
app.append(card('Every login in this demo',
  el('p', { class: 'note' },
    'Captured through each persona’s own Keycloak token, so a page shows exactly what '
    + 'that login returns — including the endpoints it is refused.'),
  table(['Login', 'Role', 'Operator', 'Tenant admin', 'Reaches'],
    personas,
    (p) => el('tr', {},
      el('td', {}, el('a', {
        href: '#', onclick: (e) => { e.preventDefault(); setPersona(p.token); location.href = '/console/'; },
      }, el('strong', {}, p.username))),
      el('td', { class: 'muted' }, p.role),
      el('td', {}, p.operator ? pill('yes', 'ok') : el('span', { class: 'muted' }, '—')),
      el('td', {}, p.tenantAdmin ? pill('yes', 'policy') : el('span', { class: 'muted' }, '—')),
      el('td', { class: 'mono muted' }, (p.reach || []).join(', ') || '—')))));

app.append(card('How the demo is built',
  el('p', {},
    'The bodies are replayed from recordings. Everything else is the real thing: the routes, '
    + 'the bearer authentication, the closed-list scope policy, the status codes, the refusals '
    + 'and the state a mutation leaves behind. The policy file mirrors the Go control plane’s, '
    + 'so a flow that works here works against the real API.'),
  el('p', { class: 'note' },
    'Nothing is synthesised. Where a field was never captured it is absent here too, because a '
    + 'demo that fills in a plausible number is a mock-up of a product that does not exist.'),
  el('div', { class: 'row', style: 'margin-top:12px' },
    el('a', { class: 'btn', href: 'https://github.com/Arqamz/npu-orchestration' }, 'Control plane →'),
    el('a', { class: 'btn', href: 'https://github.com/Arqamz/npu-orchestration-demo' }, 'This demo →'),
    el('a', { class: 'btn', href: 'https://github.com/Arqamz/npu-orchestration-demo/blob/main/docs/API-SURFACE.md' }, 'API surface →'))));
</script>
