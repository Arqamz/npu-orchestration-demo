<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serving</title>
<link rel="stylesheet" href="/shared/fleet.css">
<script>
  // Before first paint, or the page flashes the wrong theme.
  try { var t = localStorage.getItem('ascend-demo-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<main id="app"></main>

<script type="module">
import {
  call, demo, el, card, table, pill, phasePill, refusal,
  chrome, pageTitle, val, ago,
  lede, kpis, section, callout, hint, readiness, whoami,
} from '/shared/fleet.js';
import { Tour, launcher } from '/shared/tour.js';
import { AutoscaleChart } from '/shared/chart.js';

const app = document.getElementById('app');
const me = await chrome('/serving/');

const tour = new Tour("serving", [
  {
    target: null,
    title: "What an inference endpoint is",
    body: ["A model server that never finishes. You give it a model and a size range; the platform gives it a stable address and keeps the right number of copies running.", "This is the shape behind model-as-a-service: a customer sells tokens to their own customers and never thinks about a card again."],
  },
  {
    target: "[data-tour=\"kpis\"]",
    title: "What the endpoint is doing now",
    body: ["Replicas held is what is being billed. Serving is how many are actually ready \u2014 the gap between them is a replica still starting, which on this hardware takes minutes rather than seconds."],
  },
  {
    target: "main > section:nth-of-type(1)",
    title: "The autoscaling run, as it happened",
    body: ["Two panels on one time axis, never one chart with two scales: the crossing point of two differently-scaled lines is an artifact of the scaling, and a reader draws a causal conclusion from it that is not there.", "Load rises in the lower panel; replicas follow in the upper one. The dashed line is the quota ceiling \u2014 the number the autoscaler is not allowed to cross however much demand arrives."],
  },
  {
    target: "main > section:nth-of-type(2)",
    title: "Why scale-down is slower than scale-up",
    body: ["Adding a replica waits 30 seconds; removing one waits 300. The asymmetry is deliberate. A queue building costs latency now, while removing a replica throws away a warmed KV cache and buys a 258-second cold start.", "Scaling down eagerly to save device-seconds that cost less than the restart is a loss dressed as an optimisation."],
  },
]);

app.append(lede({
  eyebrow: "Tenant surface \u00b7 model serving",
  title: "Serving",
  sub: "A model running as a long-lived endpoint: given an address, scaled by demand, bounded by the quota the tenant holds, and billed by the second. The run below is real \u2014 64 concurrent clients against Qwen2-0.5B on one Atlas 800I A2, recorded frame by frame.",
  aside: launcher(tour),
}));

app.append(whoami(me));

/* ---------------------------------------------------------- the endpoint */

const listCard = card('Endpoints');
const replicaCard = card('Replicas — one Ascend 910B3 each');
app.append(listCard, replicaCard);

/* ------------------------------------------------------------- the run */

const runCard = card('Autoscaling run');
app.append(runCard);

const playBtn = el('button', { class: 'primary' }, '▶  Replay the load test');
const stopBtn = el('button', {}, 'Reset');
const clock = el('span', { class: 'mono muted' }, 'idle');

/* THE REPLAY IS SPED UP; THE REPORTED TIME IS NOT.
 *
 * The recorded run is 416 seconds. At 1:1 that is seven minutes of
 * watching a number not change, which nobody sits through — so the
 * playhead moves at a multiple of recorded time and the clock below
 * always reads the REAL offset. The point of this run is that a replica
 * takes four to five minutes to serve; a replay that made it look like
 * twelve seconds would be hiding the most important number on the page.
 *
 * 1x is kept because somebody who does not believe the run should be
 * able to watch it happen.
 */
const speedPicker = el('select', { title: 'How fast to replay recorded time' });
for (const [v, label] of [[20, '20× faster'], [40, '40× faster'], [10, '10× faster'],
  [1, 'real time (7 min)']]) {
  speedPicker.append(el('option', { value: String(v) }, label));
}

runCard.append(el('div', { class: 'row', style: 'margin-bottom:14px' },
  playBtn, stopBtn, speedPicker, clock));

const chartHost = el('div', {});
runCard.append(chartHost);

const conditionsCard = card('What the controller decided');
app.append(conditionsCard);

/* ---------------------------------------------------------------- data */

/* Declared before the block that assigns it. It was below, which is a
 * temporal dead zone error: the page parsed, rendered its header and then
 * threw on the first assignment, which looks exactly like an endpoint with
 * no data. */
let chart = null;

const seriesRes = await demo.series();
const series = seriesRes.body?.series || [];
const meta = seriesRes.body?.meta || null;

if (series.length) {
  chart = new AutoscaleChart(chartHost, series, { target: 16 });
  chart.setPlayhead(0);
  runCard.append(el('div', { class: 'legend' },
    el('span', {}, el('i', { style: 'background:var(--series-held)' }), 'NPUs held'),
    el('span', {}, el('i', { style: 'background:var(--series-serving)' }), 'replicas serving'),
    el('span', {}, el('i', { style: 'background:var(--series-ceiling)' }), 'quota ceiling (threshold)'),
    el('span', {}, el('i', { style: 'background:var(--series-load)' }), 'requests in flight')));

  const rows = chart.tableRows();
  runCard.append(el('details', { class: 'table-view' },
    el('summary', {}, 'the same run as a table'),
    table(['t', 'NPUs held', 'serving', 'ceiling', 'in flight'], rows,
      (r) => el('tr', {}, ...r.map((c, i) =>
        el('td', { class: i === 0 ? 'mono' : 'num' }, String(c)))))));
}

if (meta) {
  runCard.append(el('p', { class: 'note' },
    `${meta.concurrency} concurrent clients for ${meta.durationSeconds}s against `
    + `${meta.model}, sampled every ${meta.intervalSeconds}s. ${meta.frames} frames, `
    + `captured ${meta.capturedAt}.`));
}

/* ------------------------------------------------------------ the chart */

function drawChart(upto = Infinity) {
  if (chart) chart.setPlayhead(upto);
}

/* --------------------------------------------------------- the endpoint */

function renderEndpoint(e, offset) {
  listCard.replaceChildren(el('h2', {}, 'Endpoints'));
  listCard.append(table(
    ['Endpoint', 'Tenant', 'Model', 'Phase', 'Ready', 'Replicas', 'Ceiling', 'Devices', 'Metric', 'Address'],
    [e],
    (r) => el('tr', {},
      el('td', {}, el('strong', {}, r.name)),
      el('td', {}, r.tenant),
      el('td', { class: 'mono' }, r.model),
      el('td', {}, phasePill(r.phase)),
      el('td', { class: 'num' }, val(r.readyReplicas)),
      el('td', { class: 'num' }, val(r.replicas)),
      el('td', { class: 'num' }, r.quotaCeiling === -1
        ? el('span', { class: 'pill warn', title: 'the controller could not read the quota; this is NOT zero' }, 'unknown')
        : val(r.quotaCeiling)),
      el('td', { class: 'num' }, val(r.devicesHeld)),
      el('td', { class: 'num' }, val(r.observedMetric)),
      el('td', { class: 'mono muted wrap' }, val(r.address)))));

  // Stat row
  listCard.append(el('div', { class: 'stats', style: 'margin-top:14px' },
    el('div', { class: 'stat' },
      el('div', { class: 'k' }, 'Replicas'),
      el('div', { class: 'v' }, String(e.replicas ?? 0)),
      el('div', { class: 'n' }, `floor ${e.minReplicas} · ceiling ${e.maxReplicas}`)),
    el('div', { class: 'stat ok' },
      el('div', { class: 'k' }, 'Serving'),
      el('div', { class: 'v' }, String(e.readyReplicas ?? 0)),
      el('div', { class: 'n' }, 'replicas answering')),
    el('div', { class: 'stat warn' },
      el('div', { class: 'k' }, 'Running requests'),
      el('div', { class: 'v' }, String(parseFloat(e.observedMetric || '0').toFixed(0))),
      el('div', { class: 'n' }, `target ${e.target} per replica`)),
    el('div', { class: 'stat bad' },
      el('div', { class: 'k' }, 'NPUs held'),
      el('div', { class: 'v' }, String(e.devicesHeld ?? 0)),
      el('div', { class: 'n' }, `quota allows ${e.quotaCeiling}`)),
    el('div', { class: 'stat' },
      el('div', { class: 'k' }, 'Elapsed'),
      el('div', { class: 'v' }, offset === null ? '—' : `${Math.round(offset)}s`),
      el('div', { class: 'n' }, 'into the run'))));

  // conditions, verbatim
  conditionsCard.replaceChildren(el('h2', {}, 'What the controller decided'));
  conditionsCard.append(el('p', { class: 'note' },
    'These sentences come from the controller itself. A UI that recomputed them from the '
    + 'numbers would get them wrong: "holding 4 (3 of them not yet reporting)" and '
    + '"capped by maxReplicas" are different states with identical replica counts.'));
  conditionsCard.append(table(
    ['Condition', 'Status', 'Reason', 'Message'],
    e.conditions || [],
    (c) => el('tr', {},
      el('td', { class: 'mono' }, c.type),
      el('td', {}, pill(c.status, c.status === 'True' ? 'ok' : '')),
      el('td', { class: 'mono muted' }, c.reason),
      el('td', { class: 'wrap' }, c.message))));
}

function renderReplicas(e, podFrame) {
  replicaCard.replaceChildren(el('h2', {}, 'Replicas — one Ascend 910B3 each'));

  const pods = podFrame?.items || [];
  const detail = e.replicaDetail || [];

  // Prefer the pod objects from the frame when replaying: they carry the
  // phase transitions the summary flattens away.
  const rows = pods.length ? pods.map((p) => ({
    name: p.metadata?.name,
    phase: p.status?.phase,
    ready: (p.status?.conditions || []).some((c) => c.type === 'Ready' && c.status === 'True'),
    node: p.spec?.nodeName,
    device: p.metadata?.annotations?.['huawei.com/AscendReal'],
    rank: p.metadata?.annotations?.['hccl/rankIndex'],
    reason: (p.status?.containerStatuses || [])
      .map((c) => c.state?.waiting?.reason).filter(Boolean)[0]
      || (p.status?.conditions || []).filter((c) => c.type === 'PodScheduled' && c.status === 'False')
        .map((c) => c.reason)[0],
  })) : detail;

  const grid = el('div', { class: 'replicas' });
  for (const r of rows) {
    grid.append(el('div', { class: `replica ${r.ready ? 'ready' : 'pending'}` },
      el('div', { class: 'card-id' }, r.device || 'card not yet assigned'),
      el('div', { class: 'row', style: 'margin:5px 0' },
        phasePill(r.phase),
        r.ready ? pill('serving', 'ok') : pill('not answering', 'warn'),
        r.rank ? pill(`rank ${r.rank}`, '') : null),
      el('div', { class: 'pod' }, r.name || '—'),
      r.node ? el('div', { class: 'pod' }, r.node) : null,
      r.reason ? el('div', { class: 'pod', style: 'color:var(--warn);margin-top:4px' }, r.reason) : null));
  }

  // The empty slots up to the quota ceiling, so the ceiling is visible as
  // a thing rather than only as a number that stops moving.
  const ceiling = e.quotaCeiling > 0 ? e.quotaCeiling : e.maxReplicas;
  for (let i = rows.length; i < ceiling; i += 1) {
    grid.append(el('div', { class: 'slot' }, 'free — within quota'));
  }
  replicaCard.append(grid);

  replicaCard.append(callout('bad', 'Held is not serving — and in this run most of it never served',
    el('p', {},
      el('strong', {}, 'Held'), ' is how many cards are allocated to this endpoint and '
      + 'billed for, every second, from the moment the scheduler commits them. ',
      el('strong', {}, 'Serving'), ' is how many have finished starting and are '
      + 'answering requests. The gap between the two is a card you are paying for and '
      + 'cannot use yet.'),
    el('p', {},
      'On this hardware that gap is four to five minutes: the image is 9GB and vLLM '
      + 'compiles graphs and allocates its KV cache on first start.'),
    el('p', {},
      el('strong', {}, 'What the recorded run below actually shows: '),
      'at t+47s the autoscaler went from 1 replica to 4, so four cards were held and '
      + 'billed. A second replica answered at t+258s — for ten seconds. The third and '
      + 'fourth never became ready at all, and at t+269s the whole thing scaled back '
      + 'to one. Four cards were held for about 330 seconds and at most two ever '
      + 'served.'),
    el('p', {},
      'That is not a display problem, it is the product problem: a 4–5 minute cold '
      + 'start against a 120-second scale-down window means replicas are torn down '
      + 'before they can finish starting. Autoscaling on this hardware is close to '
      + 'useless without a warm pool, which is why one is top of the roadmap. We '
      + 'show this run because it is the clearest evidence of that, not because it '
      + 'went well.')));
}

/* -------------------------------------------------------------- driving */

async function loadStatic() {
  const res = await call('/fleet/endpoints');
  if (!res.ok) {
    listCard.replaceChildren(el('h2', {}, 'Endpoints'),
      refusal(res, 'This persona cannot read endpoints'));
    replicaCard.replaceChildren();
    conditionsCard.replaceChildren();
    return null;
  }
  const eps = res.body.endpoints || [];
  if (!eps.length) {
    listCard.replaceChildren(el('h2', {}, 'Endpoints'),
      el('p', { class: 'muted' },
        `${me?.username ?? 'this tenant'} runs no inference endpoints. `
        + 'Switch to maas-co-admin to see one.'));
    replicaCard.replaceChildren();
    conditionsCard.replaceChildren();
    return null;
  }
  const e = eps[0];
  renderEndpoint(e, null);
  renderReplicas(e, null);
  drawChart(0);
  return e;
}

let timer = null;

async function tick() {
  const res = await demo.now();
  const f = res.body;
  if (!f || !f.body) return;
  const e = (f.body.endpoints || [])[0];
  if (!e) return;
  renderEndpoint(e, f.offset);
  renderReplicas(e, f.pods);
  drawChart(f.offset);
  clock.textContent = f.running
    ? `t+${Math.round(f.offset)}s  of  ${series[series.length - 1]?.offset ?? 0}s`
    : 'run complete — settled back to the floor';
  if (!f.running && f.done) {
    clearInterval(timer); timer = null;
    playBtn.disabled = false;
    playBtn.textContent = '▶  Replay the load test';
  }
}

playBtn.addEventListener('click', async () => {
  await demo.start(Number(speedPicker.value));
  playBtn.disabled = true;
  playBtn.textContent = 'running…';
  if (timer) clearInterval(timer);
  // Poll faster than the slowest speed advances a frame, or the chart
  // skips frames at 40x and the step changes look like jumps.
  timer = setInterval(tick, Number(speedPicker.value) >= 20 ? 250 : 700);
  tick();
});

stopBtn.addEventListener('click', async () => {
  await demo.stop();
  if (timer) { clearInterval(timer); timer = null; }
  playBtn.disabled = false;
  playBtn.textContent = '▶  Replay the load test';
  clock.textContent = 'idle';
  await loadStatic();
});

const endpoint = await loadStatic();

if (!endpoint) {
  runCard.style.display = 'none';
  conditionsCard.style.display = 'none';
}

/* ------------------------------------------------------- what is missing */

app.append(card('What this flow does not do yet',
  el('p', { class: 'note' },
    'Listed here rather than hidden, because a design team needs to know which screens '
    + 'have no data behind them.'),
  el('ul', { class: 'wrap', style: 'max-width:80ch' },
    el('li', {}, el('strong', {}, 'No public address. '),
      'The endpoint is a ClusterIP. There is no ingress, no TLS and no hostname a '
      + 'customer’s client could reach — the address above resolves only inside the cluster.'),
    el('li', {}, el('strong', {}, 'No per-caller API keys. '),
      'Anything inside the cluster can call the endpoint. A MaaS customer reselling to '
      + 'their own users has nothing to issue them.'),
    el('li', {}, el('strong', {}, 'Billing is device-seconds, not tokens. '),
      'vLLM reports tokens and this platform meters cards. For an AI token factory '
      + 'that is a structural mismatch, not a missing column.'),
    el('li', {}, el('strong', {}, 'One endpoint, one model. '),
      'No shared router, so ten models mean ten cards held permanently.'),
    el('li', {}, el('strong', {}, 'Multi-card replicas are untested. '),
      'devicesPerReplica > 1 is implemented and has never been run; a 70B model needing '
      + 'tensor parallelism across four cards is unproven.'))));
tour.offer();
</script>
</body>
</html>
