<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace</title>
<link rel="stylesheet" href="/shared/fleet.css">
<script>
  // Before first paint, or the page flashes the wrong theme.
  try { var t = localStorage.getItem('ascend-demo-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<main id="app"></main>
<script type="module">
import {
  call, demo, el, card, table, pill, phasePill, refusal, chrome, pageTitle, val, ago, statusPill,
  lede, kpis, section, callout, hint, readiness, whoami, flow,
} from '/shared/fleet.js';
import { Tour, launcher } from '/shared/tour.js';

const app = document.getElementById('app');
const me = await chrome('/workspace/');
const myTenant = (me?.reach || me?.tenants || [])[0] || null;

const tour = new Tour("workspace", [
  {
    target: null,
    title: "This is the engineer\u2019s desk",
    body: ["Everything a person who writes models needs, and nothing else. Submit a job, see where it is, read its logs.", "The refusals further down are the interesting part: the same person who can spend the tenancy\u2019s cards cannot read the tenancy\u2019s invoices. Being able to run work and being able to see what it costs are different grants."],
  },
  {
    target: "[data-tour=\"kpis\"]",
    title: "What this tenancy is running",
    body: ["Jobs are work that finishes. Devices held is what is being billed right now, across every shape of workload."],
  },
  {
    target: "main > section:nth-of-type(1)",
    title: "Submitted work",
    body: ["A job that is Pending has a reason, and the reason is written to be read by the person who submitted it rather than by an operator.", "Most of the refusals this platform makes happen BEFORE a job is admitted, which is the only useful place: once the scheduler has committed, the quota is spent and the error surfaces as something about virtual devices."],
  },
]);

app.append(lede({
  eyebrow: "Tenant surface \u00b7 engineering",
  title: "Workspace",
  sub: "Where an engineer submits work, watches it schedule, and reads why it did not. This login is a member of the tenancy and deliberately not an administrator, so the billing pages are refused to it \u2014 you can see the refusals below.",
  aside: launcher(tour),
}));

app.append(whoami(me, {"member": "You can submit and cancel work here and read your own containers’ logs. The billing panels at the bottom are refused to you.", "admin": "You can submit work AND read what it costs, because you hold tenant admin.", "reseller": "You administer your own tenancy and your customers’. Work you submit here spends your own quota.", "operator": "You are reading a tenant’s workspace as the operator. A tenant sees only their own."}));

/* ----------------------------------------------- what work even is */

/* THE QUESTION THIS PAGE WAS NOT ANSWERING.
 *
 * It opened straight into a table called "Jobs" and a form with three
 * boxes. Nothing said what a job is, what you are submitting, what
 * happens to it, or what the alternatives are -- so a reader who did not
 * already know the product learned nothing from the most important
 * screen for an engineer.
 */
app.append(section('What you can run',
  'Three shapes of work, and which one you want depends on whether it finishes.',
  el('div', { class: 'cols three' },
    card('A job — work that finishes',
      el('p', {}, 'A container, a number of cards, and a command. The platform puts it in '
        + 'your queue, waits until the cards you asked for are all free, starts every '
        + 'replica at once, and stops billing the moment it exits.'),
      el('p', {}, el('strong', {}, 'Gang-scheduled: '),
        'all of its cards or none. A half-started distributed run burns the cards it '
        + 'did get while waiting for the rest, so the scheduler refuses to start one.'),
      el('p', { class: 'faint' }, 'Fine-tuning, evaluation, offline scoring, benchmarks.')),
    card('An endpoint — work that does not finish',
      el('p', {}, 'A model server with a stable address that scales with demand. It never '
        + 'completes, so it is billed continuously for the cards it holds.'),
      el('p', {}, 'Lives on the ', el('a', { href: '/serving/' }, 'Serving'),
        ' page rather than here.'),
      el('p', { class: 'faint' }, 'Chat APIs, model-as-a-service, anything with callers.')),
    card('A workspace — work you sit in front of',
      el('p', {}, 'A notebook or an SSH box with a card attached, which you open, use for '
        + 'an afternoon, and forget about. That last part is the design problem: it idles '
        + 'out on its own, because a card costs the same behind an idle browser tab as it '
        + 'does training.'),
      el('p', {}, el('strong', {}, 'Not built yet. '),
        'The shape and its validation are; the controller that creates the pod is not.'),
      el('p', { class: 'faint' }, 'Exploration, debugging, teams whose tools expect a machine.')))));

/* --------------------------------------------------- the catalog */

/* WHY THERE IS A CATALOG AT ALL.
 *
 * The request body underneath needs an extended resource name
 * (huawei.com/Ascend910-5c.1cpu.16g -- not the spelling Huawei's own
 * documentation uses), a sized memory-backed /dev/shm, and a non-root
 * uid, or the job is admitted and then fails. None of that is the
 * customer's problem, so they pick a template and the platform fills it
 * in. This table is served by the control plane at /fleet/catalog, which
 * is why a console can render a form without knowing what a template is.
 */
const cat = await call('/fleet/catalog');
if (cat.ok) {
  const avail = { available: ['runs today', 'ok'], preview: ['preview', 'warn'],
    designed: ['designed', ''] };
  app.append(section('The workload catalog',
    'You pick one of these and answer a handful of questions. You never type an extended '
    + 'resource name, size a tmpfs, or choose a uid — those are the three things that '
    + 'silently fail after a job is accepted, so the platform owns them.',
    el('div', { class: 'card flush' },
      table(
        [{ label: 'Template' }, { label: 'Runs as' }, { label: 'It asks you for' },
          { label: 'State' }],
        cat.body.templates,
        (t) => el('tr', {},
          el('td', { class: 'wrap' },
            el('strong', {}, t.title),
            el('div', { class: 'faint', style: 'font-size:12px;margin-top:2px' }, t.summary)),
          el('td', {}, el('span', { class: 'mono' }, t.kind)),
          el('td', { class: 'wrap faint', style: 'font-size:12px' },
            (t.asks || []).join(' · ')),
          el('td', {},
            pill(avail[t.availability][0], avail[t.availability][1]),
            t.blocker
              ? el('div', { class: 'faint', style: 'font-size:11px;margin-top:4px;max-width:34ch' },
                t.blocker)
              : null)))),
    callout('', 'Where the dev box and the notebook are',
      el('p', {},
        'Both are in the catalog above, marked ', el('strong', {}, 'designed'),
        '. The control plane serves them with no submit route at all, so this page '
        + 'cannot offer a button for them — that is deliberate, and it is how the API '
        + 'stops a console promising something that does not work.'),
      el('p', {},
        'A dev box is a container with a shell, your keys and a card: what VS Code '
        + 'Remote, rsync and a Makefile expect. It is not a virtual machine, and we '
        + 'do not call it one.'))));
}

/* ---------------------------------------------------------- lifecycle */

app.append(section('What happens after you submit',
  'Every refusal this platform makes happens as early in this sequence as it can. Once '
  + 'the scheduler has committed, your quota is spent and the error arrives as something '
  + 'about virtual devices.',
  flow([
    { title: 'Validated', detail: 'Shape, quota, Pod Security and mounts — before anything '
      + 'is created.', state: 'done' },
    { title: 'Queued', detail: 'Into your tenancy’s own Volcano queue.', state: 'done' },
    { title: 'Gang-scheduled', detail: 'Waits until every card is free, then starts all '
      + 'replicas together.' },
    { title: 'Running', detail: 'Billed per device-second from here. Logs are below.' },
    { title: 'Finished', detail: 'Billing stops. Output is on your volume; the pod is '
      + 'cleaned up after its TTL.' },
  ])));

/* ---------------------------------------------------------------- jobs */

const jobsCard = card('Jobs');
app.append(jobsCard);

async function renderJobs() {
  const res = await call(`/fleet/jobs${myTenant ? `?tenant=${myTenant}` : ''}`);
  jobsCard.replaceChildren(el('h2', {}, 'Jobs'));
  if (!res.ok) { jobsCard.append(refusal(res, 'Jobs')); return; }
  const jobs = res.body.jobs || [];
  jobsCard.append(table(
    ['Name', 'Tenant', 'Queue', 'Resource', 'Devices', 'Replicas', 'Phase', 'Active', 'Reason', ''],
    jobs,
    (j) => el('tr', {},
      el('td', {}, el('strong', {}, j.name), j.demoCreated ? pill('just created', 'ok') : null),
      el('td', {}, val(j.tenant)),
      el('td', { class: 'mono' }, val(j.queue, { missing: '' })),
      el('td', { class: 'mono' }, val(j.resource, { missing: '' })),
      el('td', { class: 'num' }, val(j.devices)),
      el('td', { class: 'num' }, val(j.replicas)),
      el('td', {}, phasePill(j.phase)),
      el('td', { class: 'num' }, val(j.active)),
      el('td', { class: 'wrap muted' }, val(j.reason, { missing: '' })),
      el('td', {}, el('button', {
        onclick: async () => {
          await call(`/fleet/jobs?name=${encodeURIComponent(j.name)}&tenant=${j.tenant}`,
            { method: 'DELETE' });
          renderJobs();
        },
      }, 'Delete')))));

  if (!jobs.length) {
    jobsCard.append(el('p', { class: 'note' },
      'No jobs are running for this tenant in the recording. Submitting one below creates it '
      + 'in the demo’s own state — the request, the scoping and the response are real; '
      + 'what it cannot do is actually occupy a card, because the cluster is gone.'));
  }
}
await renderJobs();

/* -------------------------------------------------------------- submit */

const nameIn = el('input', { type: 'text', value: `train-${Math.random().toString(36).slice(2, 6)}` });
const devIn = el('input', { type: 'number', value: '2', min: '1', max: '8', style: 'width:72px' });
const repIn = el('input', { type: 'number', value: '1', min: '1', max: '4', style: 'width:72px' });
const out = el('div');

app.append(card('Submit work',
  el('p', { class: 'note' },
    'A whole-card job carries spec.minResources on its PodGroup, because Huawei’s Volcano '
    + 'NPU plugin decides whether a job is an NPU job by looking for an Ascend resource name '
    + 'there. Without it the pod is never annotated with a device and admission fails with '
    + '"not get valid pod" — which presents as broken hardware.'),
  el('div', { class: 'row' },
    el('label', {}, 'name ', nameIn),
    el('label', {}, 'devices ', devIn),
    el('label', {}, 'replicas ', repIn),
    el('button', {
      class: 'primary',
      onclick: async () => {
        const res = await call('/fleet/jobs', {
          method: 'POST',
          body: {
            name: nameIn.value, devices: parseInt(devIn.value, 10),
            replicas: parseInt(repIn.value, 10),
            image: 'quay.io/ascend/vllm-ascend:v0.18.0',
          },
        });
        out.replaceChildren(el('div', { class: 'row' },
          statusPill(res.status),
          el('span', { class: 'mono' },
            res.ok ? `created ${res.body.name} in ${res.body.namespace}`
              : (res.body?.reason || 'refused'))));
        renderJobs();
      },
    }, 'Submit')),
  out));

/* ---------------------------------------------------------------- logs */

const logCard = card('Logs');
app.append(logCard);

async function renderLogs() {
  logCard.replaceChildren(el('h2', {}, 'Logs'));
  if (!myTenant) {
    logCard.append(el('p', { class: 'muted' }, 'This login holds no tenancy.'));
    return;
  }
  const pods = await demo.cluster('inferenceendpoints');
  // The pod names come from the recorded pod listing for this namespace.
  const podsRes = await call(`/fleet/endpoints?tenant=${myTenant}`);
  const candidates = [];
  for (const e of (podsRes.body?.endpoints || [])) {
    for (const r of (e.replicaDetail || [])) candidates.push(r.name);
  }
  const jobsRes = await call(`/fleet/jobs?tenant=${myTenant}`);
  for (const j of (jobsRes.body?.jobs || [])) candidates.push(`${j.name}-pod`);

  const picker = el('select', { onchange: (e) => load(e.target.value) });
  for (const c of candidates) picker.append(el('option', { value: c }, c));
  // The free-text box exists to DEMONSTRATE the boundary, not as a
  // convenience: typing another tenancy's pod name is how a reader
  // proves to themselves that the scoping is real.
  const manual = el('input', {
    type: 'text', placeholder: 'try another tenant\u2019s pod name', style: 'min-width:260px',
    onkeydown: (e) => { if (e.key === 'Enter') load(manual.value); },
  });
  const pane = el('pre', { class: 'logs' }, 'loading…');

  const load = async (pod) => {
    if (!pod) return;
    const res = await call(`/fleet/logs?tenant=${myTenant}&pod=${encodeURIComponent(pod)}&tail=400`);
    pane.replaceChildren();
    if (!res.ok) {
      pane.textContent = `${res.status}  ${res.body?.reason || 'refused'}`;
      return;
    }
    pane.textContent = (res.body.lines || []).join('\n') || '(empty)';
  };

  logCard.append(
    el('p', { class: 'note' },
      'The stdout and stderr of a container you are running — the same stream '
      + '`kubectl logs` would give you, which is how you find out why a job failed '
      + 'without anyone giving you access to the cluster.'),
    el('p', { class: 'note', style: 'margin-top:8px' },
      'Scoped like everything else: the pod is resolved inside ',
      el('strong', {}, myTenant), '’s namespace only. A pod belonging to another '
      + 'tenancy returns 404, so the caller learns it is not theirs and nothing about '
      + 'whose it is. Type one in and see.'),
    el('div', { class: 'row', style: 'margin:14px 0 10px' },
      el('span', { class: 'muted' }, 'Container'), picker,
      el('span', { class: 'faint' }, 'or'), manual),
    pane);

  // No "Read" button: the picker loads on change and the first container
  // loads on open. A control whose only job is "now actually do it" puts
  // an empty pane in front of the reader and reads as a broken page.
  if (candidates.length) load(candidates[0]);
  else pane.textContent = 'This tenancy is running nothing right now, so there are no '
    + 'containers to read.';
}
await renderLogs();

/* ------------------------------------------------- what an engineer cannot do */

const money = await call('/fleet/invoices');
app.append(card('What this login is refused',
  money.ok
    ? el('p', { class: 'muted' }, 'This persona holds the tenant administration grant, so billing is readable. Switch to acme-engineer to see the refusal.')
    : refusal(money, 'Invoices'),
  el('p', { class: 'note' },
    'An engineer is a member of the tenancy; the billing account identifier is their '
    + 'employer’s commercial data and not their business. Same tenancy, different grant, '
    + 'different answer — and both are served by the same handler.')));

/* ------------------------------------------------------------- the gaps */

app.append(card('What this surface cannot do yet',
  el('ul', { class: 'wrap', style: 'max-width:80ch' },
    el('li', {}, el('strong', {}, 'No exec, no port-forward, no file transfer. '),
      'Logs are the only way in. Debugging a wedged training run means asking the operator.'),
    el('li', {}, el('strong', {}, 'No log streaming. '),
      'The route returns a bounded tail. There is no follow, so a watch is the UI polling.'),
    el('li', {}, el('strong', {}, 'No kubeconfig issuance. '),
      'A tenant cannot be handed scoped cluster credentials, so anything not on this API is '
      + 'unreachable to them.'),
    el('li', {}, el('strong', {}, 'No job events. '),
      'A pod rejected by Pod Security reports "Running 0/2" with the only record on a '
      + 'FailedCreate event, and /fleet/events is operator-only.'),
    el('li', {}, el('strong', {}, 'No checkpoint/resume convention. '),
      'A job running for months across node reboots has nothing to resume from.'))));
tour.offer();
</script>
</body>
</html>
